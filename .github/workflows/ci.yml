name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

# Новый пуш в ту же ветку/PR отменяет предыдущий незавершённый прогон
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    android:
        name: Android (build + tests)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: zulu
                  java-version: 21

            - uses: gradle/actions/setup-gradle@v4

            - name: Host tests (shared)
              run: ./gradlew :shared:testAndroidHostTest --stacktrace

            - name: Assemble debug + release
              run: ./gradlew :androidApp:assembleDebug :androidApp:assembleRelease --stacktrace

            - name: Lint
              run: ./gradlew :androidApp:lintDebug --stacktrace

            - name: Upload debug APK
              uses: actions/upload-artifact@v4
              with:
                  name: control-debug-apk
                  path: androidApp/build/outputs/apk/debug/*.apk
                  if-no-files-found: error
                  retention-days: 7

            - name: Upload lint report
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: android-lint-report
                  path: androidApp/build/reports/lint-results-debug.html
                  if-no-files-found: ignore

    wasm:
        name: Wasm (build + tests)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-java@v4
              with:
                  distribution: zulu
                  java-version: 21

            - uses: gradle/actions/setup-gradle@v4
            - name: Allow Chrome sandbox (AppArmor)
              run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

            - name: Locate Chrome
              run: echo "CHROME_BIN=$(which google-chrome)" >> "$GITHUB_ENV"

            - name: Wasm tests (shared)
              run: ./gradlew :shared:wasmJsBrowserTest --stacktrace

            - name: Build web distribution
              run: ./gradlew :webApp:wasmJsBrowserDistribution --stacktrace

            - name: Upload web build
              uses: actions/upload-artifact@v4
              with:
                  name: control-web-dist
                  path: webApp/build/dist/wasmJs/productionExecutable
                  if-no-files-found: error
                  retention-days: 7

            - name: Upload test reports
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: wasm-test-reports
                  path: shared/build/reports/tests

    ktlint:
        name: Kotlin style (ktlint)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            -   uses: actions/checkout@v4

            -   uses: actions/setup-java@v4
                with:
                    distribution: zulu
                    java-version: 21

            -   uses: gradle/actions/setup-gradle@v4

            -   name: ktlint
                run: ./gradlew ktlintCheck --stacktrace

            -   name: Upload ktlint reports
                if: failure()
                uses: actions/upload-artifact@v4
                with:
                    name: ktlint-reports
                    path: "**/build/reports/ktlint"
                    if-no-files-found: ignore
